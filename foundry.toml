[profile.default]
src = 'contracts'
test = 'forge-tests'
out = 'out'
libs = ['lib']
solc_version = '0.8.9'
optimizer = true
optimizer_runs = 200
evm_version = 'paris'
fs_permissions = [ { access = "read-write", path = "/workspace" } ]

[fmt]
line_length = 120
tab_width = 4
quote_style = 'single'
number_underscore = 'thousands'

